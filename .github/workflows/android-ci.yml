name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create local debug key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000
      - name: Compile and run standalone tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest \
            --tests 'com.example.security.AppPinStoreTest' \
            --tests 'com.example.notifications.ReminderNotificationsTest' \
            --tests 'com.example.ExampleRobolectricTest' 2>&1 | tee android-build.log

  release-build:
    name: Release build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create throwaway release key
        run: |
          keytool -genkeypair -keystore ci-release.jks -storepass cirelease -keypass cirelease \
            -alias upload -dname 'CN=CI Release,O=Xasuus,C=SO' -keyalg RSA -keysize 2048 -validity 1000
      - name: Assemble release variant
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
          STORE_PASSWORD: cirelease
          KEY_PASSWORD: cirelease
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PversionCode=1 -PversionName=0.0.0-ci
          test -f app/build/outputs/apk/release/app-release.apk

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:rules
