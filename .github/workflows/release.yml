name: Publish Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "Missing GitHub Actions secret: ${secret}" >&2
              exit 1
            fi
          done
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3" >&2
            exit 1
          fi

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xasuus-release.jks"
          chmod 600 "$RUNNER_TEMP/xasuus-release.jks"

      - name: Create local debug key for unit tests
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000

      - name: Run unit tests before publishing
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            --tests 'com.example.security.AppPinStoreTest' \
            --tests 'com.example.notifications.ReminderNotificationsTest' \
            --tests 'com.example.ExampleRobolectricTest'

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/xasuus-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_VERSION#v}"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$RELEASE_CODE"
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Xasuus.apk"

      - name: Verify APK signature and version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/Xasuus.apk" | tee "$RUNNER_TEMP/certificates.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/certificates.txt"; then
            echo "Release APK was signed with the debug key. Check the signing secrets." >&2
            exit 1
          fi
          "$AAPT2" dump badging "$RUNNER_TEMP/Xasuus.apk" | grep -E "^(package|sdkVersion|targetSdkVersion):"
          if ! "$AAPT2" dump badging "$RUNNER_TEMP/Xasuus.apk" | grep -q "versionName='${RELEASE_VERSION#v}'"; then
            echo "APK versionName does not match tag ${RELEASE_VERSION}" >&2
            exit 1
          fi
          echo "Add the SHA-1/SHA-256 above to the Firebase Android app so Google Sign-In works in this release." | tee -a "$GITHUB_STEP_SUMMARY"
          ( cd "$RUNNER_TEMP" && sha256sum Xasuus.apk > Xasuus.apk.sha256 )

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Xasuus ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ runner.temp }}/Xasuus.apk
            ${{ runner.temp }}/Xasuus.apk.sha256
